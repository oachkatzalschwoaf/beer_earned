<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Black contour behind everything: invisible on dark menus, keeps the white
       foam and handle readable on light ones. -->
  <g stroke="#000000" fill="#000000">
    <path d="M27 15 h3 a5.5 5.5 0 0 1 5.5 5.5 v3.5 a5.5 5.5 0 0 1 -5.5 5.5 h-3" fill="none" stroke-width="5.5"/>
    <rect x="6" y="12" width="22" height="25" rx="3" stroke-width="4.5"/>
    <circle cx="8.5" cy="11" r="3.8" stroke-width="2.5"/>
    <circle cx="14.5" cy="8.6" r="4.6" stroke-width="2.5"/>
    <circle cx="21" cy="9" r="4.2" stroke-width="2.5"/>
    <circle cx="26" cy="11.2" r="3.4" stroke-width="2.5"/>
  </g>
  <!-- Handle -->
  <path d="M27 15 h3 a5.5 5.5 0 0 1 5.5 5.5 v3.5 a5.5 5.5 0 0 1 -5.5 5.5 h-3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Glass full of amber beer -->
  <rect x="6" y="12" width="22" height="25" rx="3" fill="#FFAA00" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="11" y="20" width="2" height="12" fill="#FFFF55"/>
  <rect x="21" y="20" width="2" height="12" fill="#FFFF55"/>
  <!-- Head of foam swelling over the rim -->
  <g fill="#FFFFFF">
    <rect x="5" y="11" width="24" height="6"/>
    <circle cx="8.5" cy="11" r="3.8"/>
    <circle cx="14.5" cy="8.6" r="4.6"/>
    <circle cx="21" cy="9" r="4.2"/>
    <circle cx="26" cy="11.2" r="3.4"/>
  </g>
</svg>
